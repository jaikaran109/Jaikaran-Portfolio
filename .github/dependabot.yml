version: 2
updates:
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    reviewers:
      - jaikaran109
    assignees:
      - jaikaran109
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '00:00'
      timezone: Asia/Calcutta
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
    reviewers:
      - jaikaran109
    assignees:
      - jaikaran109
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
